name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK (debug, instalable directamente)
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: voltix-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publicar en Releases (descarga directa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Voltix.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Voltix.apk --title "Voltix (última versión)" \
            --notes "APK de Voltix compilado automáticamente. Descarga Voltix.apk e instálalo en tu móvil." \
            --target "${{ github.sha }}"
