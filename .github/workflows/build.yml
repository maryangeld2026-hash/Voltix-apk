name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee build.log || {
            { grep -E "^e: " build.log; grep -A6 "What went wrong" build.log; } | head -60 | sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' > errs.txt
            echo "::error::$(cat errs.txt)"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: NexoEscritorio-apk
          path: app/build/outputs/apk/debug/*.apk
